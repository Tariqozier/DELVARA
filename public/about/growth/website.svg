<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="website-title">
  <title id="website-title">Website</title>
  <defs>
    <linearGradient id="website-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172D2E" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#89A993" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D3A0B5" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="website-shape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#172D2E" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="website-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#website-bg)"/>
  <rect x="70" y="150" width="260" height="170" rx="18" fill="url(#website-shape)" stroke="#172D2E" stroke-opacity="0.12" stroke-width="2"/>
       <circle cx="95" cy="172" r="5" fill="#F1C4AE"/>
       <circle cx="112" cy="172" r="5" fill="#D3A0B5"/>
       <circle cx="129" cy="172" r="5" fill="#89A993"/>
       <rect x="95" y="195" width="80" height="95" rx="8" fill="#89A993" fill-opacity="0.25"/>
       <rect x="190" y="195" width="120" height="40" rx="8" fill="#D3A0B5" fill-opacity="0.28"/>
       <rect x="190" y="250" width="120" height="40" rx="8" fill="#F1C4AE" fill-opacity="0.28"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">WEBSITE</text>
</svg>
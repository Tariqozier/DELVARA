<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="landing-pages-title">
  <title id="landing-pages-title">Landing pages</title>
  <defs>
    <linearGradient id="landing-pages-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89A993" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#F1C4AE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#172D2E" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="landing-pages-shape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#89A993" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="landing-pages-soft" x="-20%" y="-20%" width="140%" height="140%">

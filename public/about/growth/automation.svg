       <path d="M165 225 H235 M200 260 V270 M200 190 V160 M160 305 H130 M240 305 H270" fill="none" stroke="#172D2E" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
       <circle cx="200" cy="160" r="14" fill="url(#automation-shape)"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">AUTOMATION</text>

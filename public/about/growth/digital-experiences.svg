  <path d="M80 280 C120 180, 280 180, 320 280" fill="none" stroke="#89A993" stroke-width="3" stroke-opacity="0.45"/>
       <circle cx="120" cy="250" r="28" fill="url(#digital-experiences-shape)" stroke="#172D2E" stroke-opacity="0.1"/>
       <circle cx="200" cy="210" r="36" fill="#D3A0B5" fill-opacity="0.32"/>
       <circle cx="280" cy="250" r="28" fill="#F1C4AE" fill-opacity="0.38"/>
       <rect x="155" y="300" width="90" height="36" rx="10" fill="#172D2E" fill-opacity="0.65"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">DIGITAL EXPERIENCES</text>
</svg>
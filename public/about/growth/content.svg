<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="content-title">
  <title id="content-title">Content</title>
  <defs>
    <linearGradient id="content-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89A993" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#D3A0B5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F1C4AE" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="content-shape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#89A993" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="content-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#content-bg)"/>
  <rect x="120" y="140" width="160" height="210" rx="12" fill="url(#content-shape)" stroke="#172D2E" stroke-opacity="0.12" stroke-width="2"/>
       <rect x="145" y="170" width="110" height="12" rx="6" fill="#89A993" fill-opacity="0.4"/>
       <rect x="145" y="195" width="95" height="10" rx="5" fill="#D3A0B5" fill-opacity="0.35"/>
       <rect x="145" y="215" width="105" height="10" rx="5" fill="#F1C4AE" fill-opacity="0.35"/>
       <rect x="145" y="235" width="80" height="10" rx="5" fill="#89A993" fill-opacity="0.28"/>
       <rect x="145" y="270" width="110" height="55" rx="8" fill="#172D2E" fill-opacity="0.12"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">CONTENT</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="advertising-title">
  <title id="advertising-title">Advertising</title>
  <defs>
    <linearGradient id="advertising-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3A0B5" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#F1C4AE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#172D2E" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="advertising-shape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D3A0B5" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="advertising-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#advertising-bg)"/>
  <rect x="100" y="150" width="200" height="130" rx="14" fill="url(#advertising-shape)" stroke="#172D2E" stroke-opacity="0.12" stroke-width="2"/>
       <polygon points="200,175 240,260 160,260" fill="#F1C4AE" fill-opacity="0.45"/>
       <circle cx="130" cy="190" r="16" fill="#D3A0B5" fill-opacity="0.35"/>
       <path d="M70 120 L110 150 M330 120 L290 150" stroke="#89A993" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">ADVERTISING</text>
</svg>
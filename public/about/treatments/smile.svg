       <circle cx="165" cy="210" r="10" fill="#172D2E" fill-opacity="0.65"/>
       <circle cx="235" cy="210" r="10" fill="#172D2E" fill-opacity="0.65"/>
       <path d="M155 255 Q200 295 245 255" fill="none" stroke="#D3A0B5" stroke-width="5" stroke-linecap="round"/>
       <path d="M60 360 Q200 320 340 360" fill="none" stroke="#F1C4AE" stroke-opacity="0.45" stroke-width="2"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">SMILE</text>
</svg>
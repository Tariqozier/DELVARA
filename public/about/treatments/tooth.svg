  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#tooth-bg)"/>
  <ellipse cx="320" cy="110" rx="90" ry="70" fill="#89A993" fill-opacity="0.18" filter="url(#tooth-soft)"/>
       <path d="M140 300 C140 210, 260 180, 200 130 C170 100, 120 150, 130 220 C135 260, 155 340, 200 370 C245 340, 265 260, 270 220 C280 150, 230 100, 200 130" fill="url(#tooth-shape)" stroke="#172D2E" stroke-opacity="0.12" stroke-width="2"/>
       <path d="M175 250 Q200 270 225 250" fill="none" stroke="#89A993" stroke-width="3" stroke-linecap="round"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">TOOTH</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="injectable-product-title">
  <title id="injectable-product-title">Injectable product</title>
  <defs>
    <linearGradient id="injectable-product-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3A0B5" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#89A993" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F1C4AE" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="injectable-product-shape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D3A0B5" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="injectable-product-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#injectable-product-bg)"/>
  <rect x="165" y="120" width="70" height="200" rx="16" fill="url(#injectable-product-shape)" stroke="#172D2E" stroke-opacity="0.1" stroke-width="2"/>
       <rect x="178" y="135" width="44" height="55" rx="8" fill="#F8F5F0" stroke="#D3A0B5" stroke-opacity="0.35" stroke-width="1.5"/>
       <circle cx="200" cy="162" r="8" fill="#D3A0B5" fill-opacity="0.5"/>
       <rect x="182" y="210" width="36" height="8" rx="4" fill="#89A993" fill-opacity="0.35"/>
       <rect x="182" y="230" width="36" height="8" rx="4" fill="#89A993" fill-opacity="0.25"/>
       <ellipse cx="290" cy="310" rx="60" ry="35" fill="#F1C4AE" fill-opacity="0.2"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">INJECTABLE PRODUCT</text>
</svg>
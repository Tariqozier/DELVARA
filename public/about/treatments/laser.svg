<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="laser-title">
  <title id="laser-title">Laser</title>
  <defs>
    <linearGradient id="laser-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3A0B5" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#F1C4AE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#89A993" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D3A0B5" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="laser-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#laser-bg)"/>
  <circle cx="118" cy="210" r="34" fill="#D3A0B5" fill-opacity="0.28" filter="url(#laser-soft)"/>
  <rect x="102" y="188" width="32" height="52" rx="10" fill="#172D2E" fill-opacity="0.78"/>
  <rect x="110" y="196" width="16" height="20" rx="4" fill="#F1C4AE" fill-opacity="0.75"/>
  <path d="M134 214 L292 168" stroke="url(#laser-beam)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M134 214 L292 168" stroke="#F8F5F0" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="292" cy="168" r="10" fill="#F1C4AE" fill-opacity="0.85"/>
  <path d="M90 320 Q200 280 310 330" fill="none" stroke="#89A993" stroke-width="2" stroke-opacity="0.3"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">LASER</text>
</svg>

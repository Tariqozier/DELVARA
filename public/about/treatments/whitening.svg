<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="whitening-title">
  <title id="whitening-title">Whitening</title>
  <defs>
    <linearGradient id="whitening-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#89A993" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F1C4AE" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="whitening-shape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F5F0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8F5F0" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="whitening-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#F8F5F0"/>
  <rect width="400" height="500" fill="url(#whitening-bg)"/>
  <rect x="150" y="120" width="100" height="220" rx="22" fill="url(#whitening-shape)" stroke="#172D2E" stroke-opacity="0.1" stroke-width="2"/>
       <rect x="168" y="150" width="64" height="120" rx="10" fill="#F8F5F0" stroke="#89A993" stroke-opacity="0.35" stroke-width="2"/>
       <circle cx="200" cy="300" r="18" fill="#F1C4AE" fill-opacity="0.5"/>
       <path d="M90 180 L130 210 M310 180 L270 210" stroke="#89A993" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
       <circle cx="320" cy="130" r="36" fill="#F1C4AE" fill-opacity="0.25"/>
  <text x="32" y="468" fill="#172D2E" fill-opacity="0.55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.8" font-weight="500">WHITENING</text>
</svg>